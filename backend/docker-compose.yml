services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment: &app-env
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_SSLMODE=${DB_SSLMODE:-}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Code-execution engine (Piston). Swappable: point elsewhere to move it off-box.
      - PISTON_URL=${PISTON_URL:-http://piston:2000}
      - CODING_ENABLED=${CODING_ENABLED:-True}
      # Storage backend selector: azure | s3 | local
      - STORAGE_BACKEND=${STORAGE_BACKEND:-}
      # Azure Blob Storage
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME:-}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY:-}
      - AZURE_CONTAINER=${AZURE_CONTAINER:-media}
      # AWS S3 (legacy)
      - USE_S3=${USE_S3:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-ap-south-1}
      # Async code judging (Phase A). Celery broker/result on Redis; flip
      # CODE_JUDGE_ASYNC=True once the redis + celery-worker services are up so
      # submissions are graded off the request thread. Defaults keep the app
      # working synchronously if these are unset. (Set REDIS_URL as well to move
      # the Django cache onto Redis too — left unset here so the cache stays
      # LocMem and this change is scoped to async judging only.)
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - CODE_JUDGE_ASYNC=${CODE_JUDGE_ASYNC:-False}
      - CODE_JUDGE_PARALLELISM=${CODE_JUDGE_PARALLELISM:-1}
      # Python notebooks. Interactive execution happens in the browser
      # (Pyodide); NOTEBOOKS_SERVER_GRADING turns on the authoritative
      # server-side re-grade in the sandboxed nbrunner container below.
      - NOTEBOOKS_ENABLED=${NOTEBOOKS_ENABLED:-True}
      - NOTEBOOKS_SERVER_GRADING=${NOTEBOOKS_SERVER_GRADING:-True}
      - NOTEBOOKS_JUDGE_ASYNC=${NOTEBOOKS_JUDGE_ASYNC:-True}
      - NBRUNNER_URL=${NBRUNNER_URL:-http://nbrunner:2100}

    depends_on:
      db:
        condition: service_healthy

  # Redis — Celery broker + result backend for async code judging.
  # Internal only; no published ports. Uses noeviction so queued task messages
  # are never dropped under memory pressure (a full broker instead makes enqueue
  # fail, which the app handles by falling back to synchronous grading).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 320m

  # Celery worker — grades coding submissions off the web request thread.
  # Shares the web image and the same app environment. Concurrency defaults to 1
  # to match the single-core Piston sandbox: grading several submissions at once
  # on one core would inflate Piston's wall-clock run_timeout into spurious
  # TIME_LIMIT verdicts. Raise CELERY_CONCURRENCY together with Piston cores.
  celery-worker:
    build: .
    restart: unless-stopped
    # Skip the web entrypoint (migrate/collectstatic) — the web service owns
    # those; the worker only needs to consume the queue.
    entrypoint: []
    command: celery -A dailytaiyari worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    volumes:
      - .:/app
      - media_volume:/app/media
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated worker for the `notebooks` queue. Notebook grading re-executes a
  # whole notebook (which may train a model), so it is far longer-running than a
  # coding submission — giving it its own worker keeps a slow notebook from
  # head-of-line blocking quick coding submissions on the default queue.
  celery-nbworker:
    build: .
    restart: unless-stopped
    entrypoint: []
    command: >
      celery -A dailytaiyari worker --loglevel=info
      --queues=notebooks
      --concurrency=${CELERY_NB_CONCURRENCY:-1}
    volumes:
      - .:/app
      - media_volume:/app/media
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated worker for the `aigen` queue: AI authoring (course studio +
  # notebook generator). These are long-form LLM calls that can run for minutes
  # and are I/O-bound rather than CPU-bound, so they get their own worker with
  # higher concurrency — a slow generation must never head-of-line block coding
  # or notebook grading, and several admins may generate at once.
  celery-aiworker:
    build: .
    restart: unless-stopped
    entrypoint: []
    command: >
      celery -A dailytaiyari worker --loglevel=info
      --queues=aigen
      --concurrency=${CELERY_AI_CONCURRENCY:-4}
    volumes:
      - .:/app
      - media_volume:/app/media
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sandboxed notebook grading runner. Runs untrusted student notebook code.
  # SECURITY: never publish ports (internal docker network only); reachable only
  # from `web`/`celery-nbworker` at http://nbrunner:2100. Unlike Piston it needs
  # no privileged mode — it runs as a non-root user and each request is executed
  # in a fresh forked subprocess with RLIMIT_AS/CPU/FSIZE caps and a hard
  # wall-clock kill. Contains no app code, no credentials and no DB access.
  nbrunner:
    build: ./deploy/nbrunner
    restart: unless-stopped
    environment:
      - NBRUNNER_PORT=2100
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:2100/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No `ports:` on purpose — do NOT expose to host/internet.
    cpus: "1.0"
    mem_limit: 2g
    mem_reservation: 256m
    pids_limit: 512

  # Code-execution sandbox for coding questions. Runs untrusted student code.
  # SECURITY: never publish ports (internal docker network only); reachable only
  # from `web` at http://piston:2000. Requires privileged for Isolate sandbox;
  # walled off with strict cpu/memory/pids caps so it cannot starve the app.
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    restart: unless-stopped
    # Raise the program output cap from Piston's 1 KB default to 64 KB so
    # array-returning problems (and students' correct solutions to them) can
    # emit large outputs on big inputs without a spurious output_limit verdict.
    environment:
      - PISTON_OUTPUT_MAX_SIZE=65536
    volumes:
      - piston_data:/piston
    # No `ports:` on purpose — do NOT expose to host/internet.
    cpus: "1.0"
    mem_limit: 1536m
    mem_reservation: 256m
    pids_limit: 1024

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  piston_data:
